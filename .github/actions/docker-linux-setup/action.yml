name: Docker Linux setup
description: Set up QEMU, Docker Buildx, and optional registry login

inputs:
  auto_push_images:
    required: false
    default: false
    description: Whether registry login is needed

  qemu_image:
    required: false
    default: tonistiigi/binfmt:qemu-v10.2.3
    description: QEMU binfmt image

  platforms:
    required: false
    default: all
    description: Build platforms to derive required QEMU platforms from

  buildkit_image:
    required: false
    default: moby/buildkit:v0.34.2
    description: BuildKit image

  docker_username:
    required: false
    default: ""
    description: Docker registry username

  docker_password:
    required: false
    default: ""
    description: Docker registry password

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: ${{ inputs.qemu_image }}
        platforms: ${{ inputs.platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=${{ inputs.buildkit_image }}

    - name: Login to DockerHub
      # if: ${{ inputs.auto_push_images == 'true' }}
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}
