name: Cosign sign images
description: Sign image tags with digest via cosign

inputs:
  digest:
    required: true
    description: Built image digest
  tags:
    required: true
    description: Newline-separated image tags
  COSIGN_PASSWORD:
    required: false
    description: Local password for cosign private key
  COSIGN_PRIVATE_KEY:
    required: false
    description: Local private key for cosign

runs:
  using: composite
  steps:
    - name: Sign images on Linux
      if: runner.os != 'Windows'
      shell: bash
      env:
        DIGEST: ${{ inputs.digest }}
        TAGS: ${{ inputs.tags }}
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}

      run: |
        set -euo pipefail

        images=()

        while IFS= read -r tag; do
          [[ -n "$tag" ]] || continue
          images+=("${tag}@${DIGEST}")
        done <<< "$TAGS"

        if [[ ${#images[@]} -eq 0 ]]; then
          echo "No image tags provided"
          exit 1
        fi

        echo "::group::Images to sign"
        printf '%s\n' "${images[@]}"
        echo "::endgroup::"

        echo "::group::Signing"
        cosign sign --key env://COSIGN_PRIVATE_KEY "${images[@]}"
        echo "::endgroup::"